<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video comparison study</title>
<!--
SETUP (see README.md)
1. Videos are in videos/<scene>/{A,ours,chronogs,4dgs,swift4d}.mp4 for all 8 scenes (H.264, faststart, no audio, all 8.17 s;
   A = the real input time-lapse at 6 fps so it stays in sync with the 24 fps sweeps).
2. ENDPOINT in CONFIG is your Google Apps Script web app (collect.gs).
3. Host the folder on GitHub Pages (Settings -> Pages). Prolific study URL:
   https://<you>.github.io/<repo>/?PROLIFIC_PID={{%PROLIFIC_PID%}}&STUDY_ID={{%STUDY_ID%}}&SESSION_ID={{%SESSION_ID%}}
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Neutral mid-grey surround around the videos, as in subjective video-quality
     testing, so the page itself doesn't tint how people judge colour and contrast. */
  :root {
    --surround: #808080;
    --panel: #f3f3f3;
    --ink: #1c1c1c;
    --ink-soft: #4a4a4a;
    --line: #c9c9c9;
    --pick: #1f5fbf;
    --pick-ink: #ffffff;
    --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surround: #5e5e5e;
      --panel: #262626;
      --ink: #ededed;
      --ink-soft: #b8b8b8;
      --line: #444444;
      --pick: #5b8fe0;
      --pick-ink: #0d0d0d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--surround); color: var(--ink); font: 17px/1.55 var(--font); }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  .panel { background: var(--panel); border-radius: 6px; padding: 24px 28px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 12px; }
  h2 { font-size: 1.15rem; margin: 20px 0 6px; }
  p, li { max-width: 70ch; }
  .muted { color: var(--ink-soft); }
  button { font: inherit; cursor: pointer; }
  .primary { background: var(--pick); color: var(--pick-ink); border: 0; border-radius: 4px; padding: 10px 20px; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px 14px; }
  :focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }

  .progress { color: var(--panel); font-size: .95rem; margin-bottom: 10px; text-align: center; }
  .notice { background: var(--panel); border-left: 5px solid var(--pick); border-radius: 4px; padding: 10px 14px; margin: 0 auto 12px; max-width: 760px; font-weight: 700; }
  .ref { width: min(560px, 100%); margin: 0 auto 6px; }
  .ref-label, .vid-label { color: var(--panel); text-align: center; font-size: .95rem; margin: 4px 0 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
  video { width: 100%; display: block; background: #000; border-radius: 3px; }
  .controls { display: flex; gap: 10px; justify-content: center; margin: 12px 0 18px; }
  .controls .ghost { color: var(--panel); border-color: var(--panel); }

  .questions { background: var(--panel); border-radius: 6px; padding: 8px 20px 20px; }
  .q { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .q:last-of-type { border-bottom: 0; }
  @media (max-width: 720px) { .q { grid-template-columns: 1fr; } }
  .choices { display: flex; gap: 8px; }
  .choice { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px 16px; min-width: 96px; }
  .choice[aria-checked="true"] { background: var(--pick); color: var(--pick-ink); border-color: var(--pick); }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 12px; flex-wrap: wrap; }
  .hint { color: var(--ink-soft); font-size: .95rem; margin: 0; }
  .code { font-size: 1.4rem; font-weight: 700; letter-spacing: .04em; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ===================== CONFIG (edit this) ===================== */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbxfQL8DMfghz45tYTDJkZn86rsx4qGALPC6Yb7DMN23gnpBx2P8aLU36rMEmuGduE8I/exec",
  OURS: "ours",
  // Scene pool (videos for all 8 are in videos/). Each participant gets SCENES_PER_PARTICIPANT of them at random, with all
  // BASELINES compared against ours in each: 5 scenes x 3 baselines = 15 pairs.
  SCENES: ["house_build", "framing_house", "huntington_apartments", "metricon_home",
           "lexington_pool", "snow_melt", "house_rebuild", "fly_agaric_moss"],
  SCENES_PER_PARTICIPANT: 5,
  // Baselines compared against ours in each scene (file names without .mp4).
  BASELINES: ["chronogs", "4dgs", "swift4d"],
  // One practice pair shown first, not recorded: two baselines (a pair we never analyse), in a random scene that this
  // participant does NOT get in the study, so no scene is seen twice.
  PRACTICE: { a: "chronogs", b: "4dgs" },
  // Attention check: off (user 2026-11-13: the study is short). Set to { scene, a, b } to add an instructed-response pair.
  CATCH: null,
  QUESTIONS: [
    { key: "artifacts", text: "Which video has fewer visual errors, such as ghosting, floating blobs, smearing or see-through parts?" },
    { key: "temporal",  text: "Over time, in which video do the changes look more like real construction, with clear, solid structures instead of flickering, fading, blending or things appearing out of nowhere?" },
    { key: "spatial",   text: "As the camera moves, in which video does the scene keep a more solid, consistent 3D shape, without bending, stretching or changing with the viewpoint?" },
    { key: "faithful",  text: "Which video better follows the reference video: the same scene, and the same construction progress at each moment?" },
  ],
};
// 2026-11-13: half frame rate, same frames (sweeps 12 fps, A 3 fps, all 16.33 s); the 24/6 fps originals stay in videos/
const src = (scene, method) => `videos_halffps/${scene}/${method}.mp4`;
/* ============================================================== */

const params = new URLSearchParams(location.search);
const PID = params.get("PROLIFIC_PID") || "anon-" + Math.random().toString(36).slice(2, 10);
const SESSION = params.get("SESSION_ID") || "";
const app = document.getElementById("app");

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sides(x, y) { return Math.random() < 0.5 ? [x, y] : [y, x]; }

// Balanced scene assignment (2026-11-13): collect.gs doGet returns the SCENES_PER_PARTICIPANT least-loaded scenes
// (answered + recent unfinished assignments; a reload gets the same scenes). If the request fails or takes > 6 s,
// fall back to a uniform random draw. Every row logs which was used (assign = "server" | "random").
let MY_SCENES = [], PRACTICE_SCENE = "", ASSIGN = "random";
async function assignScenes() {
  const n = CONFIG.SCENES_PER_PARTICIPANT;
  if (CONFIG.ENDPOINT.startsWith("http")) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
    try {
      const q = new URLSearchParams({ action: "assign", pid: PID, n, scenes: CONFIG.SCENES.join(",") });
      const got = (await (await fetch(`${CONFIG.ENDPOINT}?${q}`, { signal: ctl.signal })).json()).scenes;
      if (Array.isArray(got) && got.length === n && got.every(s => CONFIG.SCENES.includes(s))) { MY_SCENES = got; ASSIGN = "server"; }
    } catch (err) { console.warn("scene assignment failed, using random scenes", err); }
    clearTimeout(timer);
  }
  if (ASSIGN !== "server") MY_SCENES = shuffle([...CONFIG.SCENES]).slice(0, n);
  const rest = CONFIG.SCENES.filter(s => !MY_SCENES.includes(s));            // practice in a scene they do not get
  PRACTICE_SCENE = rest.length ? rest[Math.floor(Math.random() * rest.length)] : CONFIG.SCENES[0];
}

function buildTrials() {
  const main = [];
  for (const scene of MY_SCENES) for (const b of CONFIG.BASELINES) {
    const [L, R] = sides(CONFIG.OURS, b);
    main.push({ id: `${scene}__${b}`, scene, kind: "main", left: L, right: R });
  }
  shuffle(main);
  if (CONFIG.CATCH) {   // never first or last, so it is not obvious
    const c = CONFIG.CATCH, pos = 2 + Math.floor(Math.random() * Math.max(1, main.length - 3));
    main.splice(pos, 0, { id: "catch", scene: c.scene, kind: "catch", left: c.a, right: c.b });
  }
  return main;
}

const state = { trials: [], idx: 0, started: Date.now() };   // trials are built after assignScenes()

// 2026-11-14: rows are saved with the same kind of GET request as the scene assignment (collect.gs doGet action=save),
// which answers {"ok": true}, so the page knows each row arrived. (sendBeacon could be dropped silently, e.g. by ad blockers:
// two participants' answers never reached the sheet.) Unconfirmed rows stay in `pending`, are retried, and are sent before
// any later row. A retry after a lost reply can duplicate a row: deduplicate on (pid, trial_id) in the analysis.
const pending = [];
let chain = Promise.resolve();
async function saveOne(row) {
  for (let a = 0; a < 3; a++) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const q = new URLSearchParams({ action: "save", row: JSON.stringify(row) });
      const r = await (await fetch(`${CONFIG.ENDPOINT}?${q}`, { signal: ctl.signal })).json();
      clearTimeout(timer);
      if (r && r.ok) return true;
    } catch (err) { clearTimeout(timer); console.warn("save failed, attempt", a + 1, err); }
    await new Promise(res => setTimeout(res, 1500 * (a + 1)));
  }
  return false;
}
async function flush() {
  while (pending.length) { if (!(await saveOne(pending[0]))) return false; pending.shift(); }
  return true;
}
// send(row) queues the row (if given) and resolves true once everything queued so far is saved; calls run one at a time.
function send(row) {
  if (!CONFIG.ENDPOINT.startsWith("http")) { if (row) console.log("ROW (no endpoint set)", row); return Promise.resolve(true); }
  if (row) pending.push(row);
  const p = chain.then(flush);
  chain = p.catch(() => false);
  return p;
}

/* ---------------- screens ---------------- */
function consent() {
  const n = state.trials.length;
  app.innerHTML = `
    <section class="panel">
      <h1>Comparing videos of changing scenes</h1>
      <p>You’ll watch ${n} pairs of short videos and choose which one looks better on four questions. There are no right or wrong answers.</p>
      <button class="primary" id="go">Continue</button>
    </section>`;
  document.getElementById("go").onclick = instructions;
}

function instructions() {
  app.innerHTML = `
    <section class="panel">
      <h1>How it works</h1>
      <p>Each screen shows a short reference video at the top: the real input time-lapse filmed from a fixed camera. Below it are two videos made from that reference. In both, the camera slowly moves to new viewpoints while time passes.</p>
      <p>Watch both videos (they play together and loop), then answer four questions by choosing Video 1 or Video 2. Pick the better one even if the difference is small. You can switch the playback speed between 1× and 2× at any time.</p>
      <h2>What the questions mean</h2>
      <ul>
        <li><strong>Visual errors:</strong> parts that look doubled, see-through, smeared, or blobs floating in the air.</li>
        <li><strong>Consistent over time:</strong> these are time-lapses, so the construction changes in jumps, as in the reference. Judge whether each change looks like real construction: structures should be clear and solid at every moment, not flicker, fade in and out, blend into each other, or appear from nowhere.</li>
        <li><strong>Consistent in 3D:</strong> as the camera moves, the scene keeps one solid 3D shape instead of bending, stretching, or looking different from each viewpoint.</li>
        <li><strong>Follows the reference:</strong> it shows the same scene as the reference, with the construction at the same stage at the same moment.</li>
      </ul>
      <p>Next is one practice pair. It isn’t recorded.</p>
      <button class="primary" id="go">Start practice</button>
    </section>`;
  document.getElementById("go").onclick = () => {
    const p = CONFIG.PRACTICE, [L, R] = sides(p.a, p.b);
    trialScreen({ id: "practice", scene: PRACTICE_SCENE, kind: "practice", left: L, right: R }, null);
  };
}

function trialScreen(trial, number) {
  const total = state.trials.length;
  const label = number === null ? "Practice" : `Pair ${number} of ${total}`;
  const notice = trial.kind === "catch"
    ? `<p class="notice">Attention check: for this pair, please choose “Video 2” for every question, whatever you see.</p>` : "";
  app.innerHTML = `
    <p class="progress">${label}</p>
    ${notice}
    <div class="ref">
      <video id="vref" src="${src(trial.scene, "A")}" muted playsinline preload="auto"></video>
      <p class="ref-label">Real input video (reference)</p>
    </div>
    <div class="pair">
      <div><video id="v1" src="${src(trial.scene, trial.left)}" muted playsinline preload="auto"></video><p class="vid-label">Video 1</p></div>
      <div><video id="v2" src="${src(trial.scene, trial.right)}" muted playsinline preload="auto"></video><p class="vid-label">Video 2</p></div>
    </div>
    <div class="controls">
      <button class="ghost" id="replay">Replay from start</button>
      <button class="ghost" id="pause">Pause</button>
      <button class="ghost" id="speed">Speed: 1×</button>
    </div>
    <section class="questions">
      ${CONFIG.QUESTIONS.map(q => `
        <div class="q" role="radiogroup" aria-label="${q.text}">
          <span>${q.text}</span>
          <div class="choices">
            <button class="choice" role="radio" aria-checked="false" data-q="${q.key}" data-side="left">Video 1</button>
            <button class="choice" role="radio" aria-checked="false" data-q="${q.key}" data-side="right">Video 2</button>
          </div>
        </div>`).join("")}
      <div class="footer">
        <p class="hint" id="hint">Answer all four questions to continue. The videos keep looping.</p>
        <button class="primary" id="next" disabled>${number === null ? "Start the study" : "Next pair"}</button>
      </div>
    </section>`;

  const vids = ["vref", "v1", "v2"].map(id => document.getElementById(id));
  const answers = {};
  let watched = false, plays = 0, started = false, unlockedBy = "", videoErrors = 0;
  const t0 = performance.now();
  const choiceBtns = [...app.querySelectorAll(".choice")];
  const next = document.getElementById("next"), hint = document.getElementById("hint");

  // playback speed: natural speed by default, 2x on request; applied to all three so they stay in sync (logged per pair)
  let rate = state.rate || 1, maxRate = rate;
  const speedBtn = document.getElementById("speed");
  function applyRate() { vids.forEach(v => { v.playbackRate = rate; }); speedBtn.textContent = `Speed: ${rate}×`; }
  speedBtn.onclick = () => { rate = rate === 1 ? 2 : 1; state.rate = rate; maxRate = Math.max(maxRate, rate); applyRate(); };
  applyRate();
  // play all three in sync; when the compared pair ends, restart all together
  function restart() { vids.forEach(v => { v.currentTime = 0; v.playbackRate = rate; }); Promise.all(vids.map(v => v.play().catch(() => {}))); }
  // start once all three can play through; the 4 s fallback covers events that fired before the listener was attached
  function tryStart() { if (!started && vids.every(v => v.readyState >= 4)) { started = true; restart(); } }
  vids.forEach(v => v.addEventListener("canplaythrough", tryStart));
  tryStart();
  setTimeout(() => { if (!started) { started = true; restart(); } }, 4000);
  // 2026-11-14 (user): answers are open from the start (no need to watch to the end first). Whether the compared pair
  // had played to the end before the answer is still logged: watched_end = "ended" | "end" (within 0.3 s of the end), "" = not yet.
  function markWatched(by) { if (!watched) { watched = true; unlockedBy = by; } }
  vids.forEach(v => {
    v.addEventListener("ended", () => {
      if (v !== vids[1] && v !== vids[2]) return;      // the compared pair drives the loop
      plays++;
      markWatched("ended");
      restart();
    });
    v.addEventListener("timeupdate", () => {
      if ((v === vids[1] || v === vids[2]) && v.duration && v.currentTime >= v.duration - 0.3) markWatched("end");
    });
    v.addEventListener("error", () => { videoErrors++; hint.textContent = "A video could not be loaded. Please check your connection and reload the page."; });
  });
  document.getElementById("replay").onclick = restart;
  const pauseBtn = document.getElementById("pause");
  pauseBtn.onclick = () => {
    const paused = vids[1].paused;
    vids.forEach(v => paused ? v.play() : v.pause());
    pauseBtn.textContent = paused ? "Pause" : "Play";
  };

  choiceBtns.forEach(b => b.onclick = () => {
    const q = b.dataset.q;
    choiceBtns.filter(x => x.dataset.q === q).forEach(x => x.setAttribute("aria-checked", x === b ? "true" : "false"));
    answers[q] = b.dataset.side;
    next.disabled = Object.keys(answers).length < CONFIG.QUESTIONS.length;
  });

  function advance() {
    if (number === null) { state.idx = 0; return showTrial(); }
    state.idx++;
    state.idx < state.trials.length ? showTrial() : done();
  }
  let queued = false;
  next.onclick = async () => {
    vids.forEach(v => v.pause());
    if (trial.kind !== "practice") {
      if (!queued) {   // the row is built once; answers are frozen from here on
        const chosen = {};
        for (const q of CONFIG.QUESTIONS) chosen[q.key] = answers[q.key] === "left" ? trial.left : trial.right;
        const check = trial.kind === "catch" ? CONFIG.QUESTIONS.every(q => answers[q.key] === "right") : "";
        pending.push({
          pid: PID, session: SESSION, trial_index: number, trial_id: trial.id, scene: trial.scene, kind: trial.kind,
          left_method: trial.left, right_method: trial.right, ...Object.fromEntries(CONFIG.QUESTIONS.map(q => ["q_" + q.key, chosen[q.key]])),
          check_passed: check, assign: ASSIGN,
          rt_ms: Math.round(performance.now() - t0), plays, speed_end: rate, speed_max: maxRate, watched_end: unlockedBy,
          video_errors: videoErrors, user_agent: navigator.userAgent,
        });
        queued = true; choiceBtns.forEach(b => b.disabled = true);
      }
      next.disabled = true; next.textContent = "Saving…";
      if (!(await send(null))) {
        next.disabled = false; next.textContent = "Try again";
        hint.innerHTML = `Your answers could not be saved (connection problem, or a browser extension such as an ad blocker
          blocking the request). Please click “Try again”; if it keeps failing, pause your ad blocker for this page.
          <button class="ghost" id="skipsave">Continue anyway</button>`;
        document.getElementById("skipsave").onclick = advance;   // the row stays queued and is retried with the next one
        return;
      }
    }
    advance();
  };
}

function showTrial() { window.scrollTo(0, 0); trialScreen(state.trials[state.idx], state.idx + 1); }

function done() {
  pending.push({ pid: PID, session: SESSION, trial_index: "", trial_id: "_complete", kind: "complete", assign: ASSIGN,
                 scenes: MY_SCENES.join(","), rt_ms: Date.now() - state.started, user_agent: navigator.userAgent });
  finish();
}
async function finish() {   // the thank-you page only appears once every row is confirmed
  app.innerHTML = `<section class="panel"><p>Saving your answers…</p></section>`;
  if (await send(null)) {
    app.innerHTML = `
      <section class="panel">
        <h1>Thank you, you’re done</h1>
        <p>Your answers have been recorded. You can close this tab.</p>
      </section>`;
    return;
  }
  app.innerHTML = `
    <section class="panel">
      <h1>Almost done</h1>
      <p>Some of your answers could not be saved yet (connection problem, or an ad blocker blocking the request).
         Please keep this tab open and click “Try again”; if it keeps failing, pause your ad blocker for this page and try again.</p>
      <button class="primary" id="retry">Try again</button>
    </section>`;
  document.getElementById("retry").onclick = finish;
}

app.innerHTML = `<section class="panel"><p>Loading…</p></section>`;
assignScenes().then(() => {
  state.trials = buildTrials();
  // 2026-11-14: a "start" row per participant, so the sheet shows who reached the study even if they stop early
  send({ pid: PID, session: SESSION, trial_index: "", trial_id: "_start", kind: "start", assign: ASSIGN,
         scenes: MY_SCENES.join(","), user_agent: navigator.userAgent });
  consent();
});
</script>
</body>
</html>
